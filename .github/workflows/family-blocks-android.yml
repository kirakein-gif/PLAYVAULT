# Builds the BLOCK MASTER offline debug APK and runs it on an Android emulator
# with networking switched off. Scoped to games/family-blocks only.
name: family-blocks-android

on:
  push:
    paths:
      - 'games/family-blocks/**'
      - '.github/workflows/family-blocks-android.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: games/family-blocks

jobs:
  # Produce a reproducible web build on the isolated implementation branch.
  web-build-refresh:
    if: github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/family-blocks-solo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/family-blocks/package-lock.json
      - name: Install deps
        working-directory: games/family-blocks
        run: npm ci
      - name: Generate static web build
        working-directory: games/family-blocks
        run: npm run build:web
      - name: Commit generated output to implementation branch only
        working-directory: .
        run: |
          git add games/family-blocks/play
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(family-blocks): refresh web output'
            git push origin HEAD:chatgpt/family-blocks-solo
          fi

  unit-tests:
    needs: web-build-refresh
    if: always() && (needs.web-build-refresh.result == 'success' || needs.web-build-refresh.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/family-blocks/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx vitest run
      - name: Install Chromium for offline acceptance tests
        run: |
          npm install --no-save playwright@1.63.0 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Offline browser E2E (two tablet sizes + 60s autoplay)
        run: node tests/e2e/run-e2e.mjs
      - name: Save browser layout screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-blocks-browser-e2e
          path: games/family-blocks/test-results/e2e
          if-no-files-found: warn
      - name: Committed web build (play/) matches the source
        run: |
          npm run build:web
          git status --porcelain -- play
          test -z "$(git status --porcelain -- play)" || { echo "play/ is stale: run npm run build:web and commit"; exit 1; }

  build:
    needs: unit-tests
    # web-build-refresh is skipped outside the ChatGPT branch; without an explicit
    # condition that skip would cascade and skip the APK build on main.
    if: ${{ !cancelled() && needs.unit-tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/family-blocks/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK packages (runner's preinstalled SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - run: npm ci
      - name: Web build
        run: npm run build
      - name: Capacitor sync
        run: npx cap sync android
      - name: No INTERNET permission in Android manifest
        run: |
          if grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            echo 'Offline policy violation: INTERNET permission present'; exit 1
          fi
      - name: Assemble debug APK
        working-directory: games/family-blocks/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/FamilyBlocks-v1.0.0-debug.apk
          ls -l out
          unzip -l out/FamilyBlocks-v1.0.0-debug.apk | grep -E "assets/.*[.]js|index[.]html"
      - name: Assert packaged APK has no INTERNET permission
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -1)
          $AAPT dump permissions out/FamilyBlocks-v1.0.0-debug.apk | tee out/permissions.txt
          if grep -q 'android.permission.INTERNET' out/permissions.txt; then
            echo 'Offline policy violation in packaged APK'; exit 1
          fi
      - name: Verify the fixed family signing key
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs out/FamilyBlocks-v1.0.0-debug.apk | tee out/signer.txt
          grep -q "SHA-256 digest: $FAMILY_CERT_SHA256" out/signer.txt || { echo "APK is not signed with the family key"; exit 1; }
        env:
          FAMILY_CERT_SHA256: bc658c0933d0a9cdedecd65926f5eb14c5c767882f65fc8317295772d53e8a6a
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyBlocks-v1.0.0-debug-apk
          path: games/family-blocks/out/FamilyBlocks-v1.0.0-debug.apk
          if-no-files-found: error

  emulator-offline-test:
    needs: [unit-tests, build]
    if: ${{ !cancelled() && needs.unit-tests.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FamilyBlocks-v1.0.0-debug-apk
          path: games/family-blocks/out
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Playwright (Android driver only, no browsers; separate folder)
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.63.0
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Install and run on a tablet emulator (network off)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          ram-size: 4096M
          heap-size: 512M
          # portrait tablet-sized screen (800x1280 at 160 dpi): the APK is locked upright
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -skin 800x1280 -prop qemu.sf.lcd_density=160
          working-directory: games/family-blocks
          script: |
            adb install -r out/FamilyBlocks-v1.0.0-debug.apk
            adb shell dumpsys package com.playvault.familyblocks | grep -E "versionName|android.permission" || true
            mkdir -p android-smoke; (adb logcat -v time > android-smoke/logcat-full.txt 2>&1 &); node tests/android/smoke.cjs android-smoke || { echo '--- logcat (crash related) ---'; grep -iE 'FATAL|crash|tombstone|died|lowmemory|lmkd|renderer|chromium.*(error|fatal)|AndroidRuntime|DEBUG   :|signal [0-9]' android-smoke/logcat-full.txt | tail -150; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-results
          path: games/family-blocks/android-smoke

  # Keeps the APK permanently: Actions artifacts expire after 90 days, release
  # files do not. Runs only on main, and only after the emulator test passed.
  release:
    needs: [unit-tests, build, emulator-offline-test]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.unit-tests.result == 'success' && needs.build.result == 'success' && needs.emulator-offline-test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FamilyBlocks-v1.0.0-debug-apk
          path: games/family-blocks/out
      - name: Publish or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="family-blocks-v$VERSION"
          APK="out/FamilyBlocks-v$VERSION-debug.apk"
          ( cd out && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256" )
          {
            echo "BLOCK MASTER v$VERSION - offline Android tablet block puzzle (family build)."
            echo ""
            echo "Install: download $(basename "$APK"), copy it to the tablet and tap it (allow installs from this source)."
            echo "Signed with the fixed family key (certificate SHA-256 bc658c09...3e8a6a), so later builds install over this one and keep the records."
            echo ""
            echo "Built from ${GITHUB_SHA::7} by run ${GITHUB_RUN_NUMBER}. Unit tests and the offline emulator test passed."
            echo "Personal sideload build, not for the Play Store."
          } > out/notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
            gh release edit "$TAG" --notes-file out/notes.md
          else
            gh release create "$TAG" "$APK" "$APK.sha256" --target "$GITHUB_SHA" --title "BLOCK MASTER v$VERSION" --notes-file out/notes.md
          fi
