<!doctype html><meta charset="utf-8"><title>Eclipse local verification</title>
<style>body{overflow:hidden;margin:0;background:#090a10;color:#eee;font:14px system-ui}nav{height:44px;display:flex;gap:8px;align-items:center;padding:0 10px;overflow-x:auto}button{cursor:pointer;white-space:nowrap;flex-shrink:0}iframe{display:block;border:0;width:100%;height:calc(100vh - 44px)}</style>
<nav><button id="launch">Launch inspection</button><button id="toggleDoors">Toggle doors</button><button id="allDoors">Four doors</button><button id="gallery">Relic gallery</button><button id="dawn">Dawn</button><button id="night">Night</button><button id="move">Run right for 2 seconds</button><button id="combat">Combat</button><button id="clearRoom">Clear combat</button><button id="chest">Chest</button><button id="pool">Pool</button><button id="altar">Altar</button><button id="stairs">Stairs</button><button id="souls">Soul drops</button><button id="interact">Interact</button><button id="level">Level up</button><button id="freeze">Freeze / resume</button><button id="floor">Next floor</button><button id="boss">Boss</button><button id="defeat">Defeat boss / descend</button><span id="status">Local test controls</span></nav>
<iframe id="game" src="../games/abyssfall-eclipse/"></iframe>
<script>
const frame=document.querySelector('iframe'),status=document.getElementById('status');
const get=()=>frame.contentWindow.AF;
for(const [id,label,fn] of [
 ['specialPreview','Special effect',()=>{const a=get();a.player.special=0;a.paused=false;a.useSpecial();for(const fx of a.slashes)fx.l=fx.max*.55;for(const fx of a.shockwaves){fx.l=16;fx.r=fx.max*.8}a.paused=true}],
 ['windPreview','Tower wind',()=>{const a=get();while(a.floor<7)a.nextFloor();const r=Object.values(a.rooms).find(r=>r.type==='combat');a.current=`${r.x},${r.y}`;r.spawned=true;r.windActive=100;r.windX=.9;r.windY=.35;r.windStrength=1.8;a.paused=true}],
 ['lockedPreview','Sealed gates',()=>{const a=get(),r=a.cur();r.clear=true;a.bossUnlocked=false;for(const [d,dx,dy] of [['N',0,-1],['S',0,1],['W',-1,0],['E',1,0]]){r.doors[d]=true;a.rooms[`${r.x+dx},${r.y+dy}`]={x:r.x+dx,y:r.y+dy,type:'boss',clear:false,doors:{},enemies:[]}}a.paused=true}],
 ['sealPreview','Seal stone',()=>{const a=get(),r=a.cur();r.sealAltar=true;r.sealBroken=false;r.clear=true;r.spawned=true;r.enemies=[];a.player.x=a.W/2+130;a.paused=true}]
]){const b=document.createElement('button');b.id=id;b.textContent=label;b.onclick=()=>{fn();status.textContent=label};document.querySelector('nav').append(b)}
for(const key of ['dawn','night'])document.getElementById(key).onclick=()=>{const a=get();a.selected=key;a.newRun();status.textContent=key};
document.getElementById('move').onclick=()=>{const a=get();a.keys.d=true;setTimeout(()=>a.keys.d=false,2000)};
document.getElementById('combat').onclick=()=>{const a=get();a.player.inv=9999;const r=Object.values(a.rooms).find(r=>r.type==='combat');a.current=`${r.x},${r.y}`;a.player.x=a.W/2;a.player.y=a.arena.y+a.arena.h*.72;status.textContent='Combat: protection for visual inspection'};
document.getElementById('clearRoom').onclick=()=>{const a=get();a.cur().enemies.filter(e=>e.alive).forEach(e=>a.damage(e,e.max));status.textContent='Combat defeated; doors open on next frame'};
for(const [button,type] of [['chest','treasure'],['pool','recovery'],['stairs','exit'],['altar','altar']])document.getElementById(button).onclick=()=>{
 const a=get();if(type==='altar'){while(!a.isBossFloor())a.nextFloor()}
 const r=Object.values(a.rooms).find(r=>type==='altar'?r.sealAltar:r.type===type);
 if(!r){status.textContent='Room absent on this floor';return}
 a.current=`${r.x},${r.y}`;a.player.inv=99999;a.player.x=a.W/2+130;a.player.y=a.arena.y+a.arena.h*.72;
 status.textContent=button+' prop';
};
document.getElementById('interact').onclick=()=>{const a=get();a.player.x=a.W/2;a.player.y=a.arena.y+a.arena.h/2;status.textContent='Approached object'};
document.getElementById('level').onclick=()=>{const a=get();a.pickups.push({x:a.player.x,y:a.player.y,val:a.player.nextXp});status.textContent='XP pickup for keyboard choice test'};
document.getElementById('souls').onclick=()=>{const a=get();for(let i=0;i<6;i++)a.pickups.push({x:a.W/2-70+i*28,y:a.arena.y+a.arena.h*.42,vx:0,vy:0,val:3,phase:i*.9});status.textContent='Soul drops for visual inspection'};
document.getElementById('freeze').onclick=()=>{const a=get();if(a.rewardChoices?.length)return;a.paused=!a.paused;if(a.paused)a.player.inv=0;else a.player.inv=9999;status.textContent=a.paused?'Visual frame frozen':'Simulation resumed'};
document.getElementById('floor').onclick=()=>{get().nextFloor();status.textContent=`${get().floor}F`};
document.getElementById('boss').onclick=()=>{const a=get();while(!a.isBossFloor())a.nextFloor();const r=Object.values(a.rooms).find(r=>r.type==='boss');a.current=`${r.x},${r.y}`;a.bossUnlocked=true;a.player.inv=99999;a.player.basic=99999;a.player.x=a.W/2;a.player.y=a.arena.y+a.arena.h*.8;frame.contentWindow.PV_AUDIO.startBoss();status.textContent=`${a.floor}F boss`};
document.getElementById('defeat').onclick=()=>{const a=get(),e=a.cur().enemies.find(e=>e.type==='boss');e.intro=0;while(e.alive)a.damage(e,e.max);setTimeout(()=>{a.player.x=a.W/2;a.player.y=a.arena.y+a.arena.h/2},850);setTimeout(()=>status.textContent=`${a.floor}F, paused=${a.paused}, transitioning=${a.transitioning}`,2000)};
document.getElementById('toggleDoors').onclick=()=>{const a=get();a.cur().clear=!a.cur().clear;a.paused=true;status.textContent=a.cur().clear?'Open doors; fixed stonework':'Closed door leaves; fixed stonework'};
document.getElementById('allDoors').onclick=()=>{const a=get(),r=a.cur();a.bossUnlocked=true;for(const [d,x,y,opp] of [['N',0,-1,'S'],['S',0,1,'N'],['W',-1,0,'E'],['E',1,0,'W']]){r.doors[d]=true;const k=`${r.x+x},${r.y+y}`;a.rooms[k]??={x:r.x+x,y:r.y+y,type:'empty',clear:true,doors:{[opp]:true},enemies:[],seen:false};}status.textContent='All four connected passages';};
document.getElementById('gallery').onclick=()=>{const a=frame.contentWindow.AF_ART,old=document.getElementById('galleryView');if(old){old.remove();return}const box=document.createElement('div');box.id='galleryView';box.style='position:fixed;inset:44px 0 0;background:#101116;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:8px;padding:15px;z-index:5;overflow:auto';for(const [id,src] of Object.entries(a.relicIcons||{})){const item=document.createElement('figure');item.style='margin:0;border:1px solid #39352e;background:#17181c;display:flex;flex-direction:column;align-items:center;min-height:0';const im=document.createElement('img');im.src=src;im.alt=id;im.style='width:100%;height:calc(100% - 28px);object-fit:contain';item.append(im);const label=document.createElement('figcaption');label.textContent=id;item.append(label);box.append(item)}document.body.append(box)};
document.getElementById('launch').onclick=()=>{const a=get(),p=a.player,r=a.cur(),sign=document.getElementById('launch').dataset.face==='left'?-1:1,cy=a.arena.y+a.arena.h*.55;document.getElementById('launch').dataset.face=sign>0?'left':'right';p.faceX=sign;r.clear=true;p.inv=0;p.x=a.W/2-sign*110;p.y=cy+70;p.attackPose=14;p.attackAt=performance.now();p.moving=false;r.enemies=[{x:a.W/2-sign*110,y:cy-80,type:'shooter',alive:true,faceX:sign,r:20,max:100,hp:100,attackPose:18}];a.projectiles=[];for(const [source,target,kind,team] of [[p,{x:p.x+sign*260,y:p.y,type:'shooter'},p.hero.key==='dawn'?'light':'crescent','p'],[r.enemies[0],{x:p.x+sign*260,y:cy-80,hero:p.hero},'priestBolt','e']]){for(const age of [0,5,13,22]){const q={team,kind,x:source.x+sign*age*7,y:source.y,vx:sign*7,vy:0,r:5,life:100,dmg:1};a.presentProjectile(q,source,target);q.visualAge=age;a.projectiles.push(q)}}a.paused=true;status.textContent='Frozen hand launch and elevated flight; collision coordinates unchanged';};
const audioStatus=document.createElement('span');audioStatus.id='audioStatus';document.querySelector('nav').append(audioStatus);
setInterval(()=>{const audio=frame.contentWindow.PV_AUDIO,a=get();audioStatus.textContent=(audio?.ctx?`Audio ${audio.ctx.state}; mode ${audio.mode}; decoded ${Object.keys(audio.trackBuffers).length}; loops ${audio.musicNodes.filter(n=>n.buffer&&n.loop).length}; voices ${audio.voices}`:'Audio pending')+(a?.started?`; doors ${Object.keys(a.cur().doors).filter(d=>a.cur().doors[d]).map(d=>d+':'+(a.isDoorOpen(d)?'open':'closed')).join(' ')}; paused ${a.paused}`:'')},500);
</script>
